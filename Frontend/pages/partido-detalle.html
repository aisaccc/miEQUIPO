<div id="detalle-partido">
  <!-- Se llena dinámicamente -->
</div>

<!-- ================= MODAL: EDITAR PARTIDO ================= -->
<div class="modal-backdrop" id="modal-editar-partido">
  <div class="modal" style="max-width: 600px;">
    <div class="modal__header">
      <h3 class="modal__title">Editar partido</h3>
      <button class="modal__close" data-cerrar-modal="modal-editar-partido">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="modal__body">
      <div class="field">
        <label class="field__label" for="edit-titulo">Título *</label>
        <input type="text" id="edit-titulo" class="field__input" maxlength="80" />
      </div>

      <div class="form-row">
        <div class="field">
          <label class="field__label" for="edit-fecha">Fecha *</label>
          <input type="date" id="edit-fecha" class="field__input" />
        </div>
        <div class="field">
          <label class="field__label" for="edit-hora">Hora *</label>
          <input type="time" id="edit-hora" class="field__input" />
        </div>
      </div>

      <div class="field">
        <label class="field__label" for="edit-lugar">Lugar *</label>
        <input type="text" id="edit-lugar" class="field__input" />
      </div>

      <div class="field">
        <label class="field__label" for="edit-cupos">Cupos totales *</label>
        <input type="number" id="edit-cupos" class="field__input" min="2" max="50" />
        <p class="text-xs text-muted mt-4" id="edit-cupos-hint"></p>
      </div>

      <div class="field">
        <label class="switch mb-4">
          <input type="checkbox" id="edit-gratis" />
          <span class="switch__slider"></span>
          <div>
            <div class="switch__label">Partido gratis</div>
            <div class="switch__hint">Desactiva para cobrar inscripción</div>
          </div>
        </label>

        <div id="edit-precio-wrapper" class="hidden">
          <label class="field__label" for="edit-precio">Valor de inscripción (CLP)</label>
          <input type="number" id="edit-precio" class="field__input" min="0" step="500" />
        </div>
      </div>

      <div class="field">
        <label class="field__label" for="edit-descripcion">Descripción</label>
        <textarea id="edit-descripcion" class="textarea" maxlength="300"></textarea>
      </div>

      <div class="aviso-aprobacion show" id="edit-aviso-cambios">
        <span class="aviso-aprobacion__icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
            <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
          </svg>
        </span>
        <div>
          Los <strong>inscritos</strong> recibirán una notificación con los cambios que hagas.
        </div>
      </div>
    </div>

    <div class="modal__footer">
      <button class="btn btn--ghost" data-cerrar-modal="modal-editar-partido">Cancelar</button>
      <button class="btn btn--primary" id="btn-guardar-edicion">Guardar cambios</button>
    </div>
  </div>
</div>

<!-- ================= MODAL: GESTIONAR EQUIPOS POSTULANTES ================= -->
<div class="modal-backdrop" id="modal-equipos-postulantes">
  <div class="modal" style="max-width: 660px;">
    <div class="modal__header">
      <h3 class="modal__title">Equipos postulantes</h3>
      <button class="modal__close" data-cerrar-modal="modal-equipos-postulantes">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="modal__body" id="equipos-postulantes-body">
      <!-- Se llena dinámicamente -->
    </div>

    <div class="modal__footer">
      <button class="btn btn--ghost" data-cerrar-modal="modal-equipos-postulantes">Cerrar</button>
    </div>
  </div>
</div>

<!-- ================= MODAL: VER EQUIPO (PERFIL PÚBLICO) ================= -->
<div class="modal-backdrop" id="modal-ver-equipo">
  <div class="modal" style="max-width: 760px; width: 95%;">
    <div class="modal__header" style="padding-bottom: 0; border-bottom: none;">
      <h3 class="modal__title" id="ver-equipo-titulo" style="font-size: var(--fs-base);">Perfil del equipo</h3>
      <button class="modal__close" data-cerrar-modal="modal-ver-equipo">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="modal__body" id="ver-equipo-body" style="padding: 0; border-radius: 0 0 var(--radius-lg) var(--radius-lg); overflow: hidden;">
      <!-- Se llena dinámicamente con renderGrupoPublico -->
    </div>
  </div>
</div>

<!-- ================= MODAL: CONFIRMAR PARTIDO (modo Organizar) ================= -->
<div class="modal-backdrop" id="modal-confirmar-partido">
  <div class="modal" style="max-width: 520px;">
    <div class="modal__header">
      <h3 class="modal__title" id="confirmar-titulo">Confirmar partido</h3>
      <button class="modal__close" data-cerrar-modal="modal-confirmar-partido">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="modal__body">
      <div class="aviso-aprobacion show mb-4">
        <span class="aviso-aprobacion__icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 11 18-5v12L3 14v-3z"/>
            <path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>
          </svg>
        </span>
        <div>
          Al confirmar, <strong>se cierra el partido</strong> y el interesado
          recibirá una notificación para aprobar la confirmación.
        </div>
      </div>

      <div class="form-row">
        <div class="field">
          <label class="field__label" for="confirmar-fecha">Fecha *</label>
          <input type="date" id="confirmar-fecha" class="field__input" />
        </div>
        <div class="field">
          <label class="field__label" for="confirmar-hora">Hora *</label>
          <input type="time" id="confirmar-hora" class="field__input" />
        </div>
      </div>

      <div class="field">
        <label class="field__label" for="confirmar-lugar">Lugar *</label>
        <input type="text" id="confirmar-lugar" class="field__input"
               placeholder="Ej: Cancha Sur, Santiago" maxlength="120" />
      </div>

      <div class="field">
        <label class="field__label" for="confirmar-precio">Precio por jugador (CLP)</label>
        <input type="number" id="confirmar-precio" class="field__input"
               min="0" step="500" value="0" />
        <p class="text-xs text-muted mt-4">0 = gratis</p>
      </div>

      <div class="field">
        <label class="field__label">Mensaje al interesado (opcional)</label>
        <textarea id="confirmar-mensaje" class="textarea"
                  placeholder="Ej: ¡Confirmemos para el sábado!" maxlength="200"></textarea>
      </div>
    </div>

    <div class="modal__footer">
      <button class="btn btn--ghost" data-cerrar-modal="modal-confirmar-partido">Cancelar</button>
      <button class="btn btn--primary" id="btn-confirmar-partido">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        Confirmar partido
      </button>
    </div>
  </div>
</div>
