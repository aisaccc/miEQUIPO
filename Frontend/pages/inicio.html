<!-- ================= SALUDO / HEADER DE PÁGINA ================= -->
<div class="page-hero">
  <div class="page-eyebrow" id="inicio-eyebrow">Cargando...</div>
  <h1 class="page-title page-title--xl" id="inicio-titulo">¡Hola!</h1>
  <p class="page-subtitle">Esto es lo que está pasando en tu comunidad deportiva.</p>
</div>

<div class="page-grid">

  <!-- ================= COLUMNA PRINCIPAL ================= -->
  <div class="page-grid__main">

    <!-- Composer -->
    <div class="composer">
      <div class="composer__top">
        <img id="composer-avatar" src="" alt="" class="avatar avatar--md" />
        <button class="composer__input" id="btn-abrir-composer">
          ¿Qué estás pensando?
        </button>
      </div>
    </div>

    <!-- Filtros del feed -->
    <div class="feed-filters">
      <button class="chip chip--active" data-feed="todo">Todo</button>
      <button class="chip" data-feed="post">Publicaciones</button>
      <button class="chip" data-feed="partido">Partidos</button>
      <button class="chip" data-feed="torneo">Torneos</button>
      <button class="chip" data-feed="grupo">Grupos</button>
      <button class="chip" data-feed="amigos">Amigos</button> <!-- ⚡ NUEVO -->
    </div>

    <!-- Feed -->
    <div id="feed"></div>

  </div>

  <!-- ================= COLUMNA LATERAL ================= -->
  <aside class="page-grid__aside">

    <!-- Agenda: próximos partidos -->
    <div class="card mb-4">
      <div class="flex items-center justify-between mb-4">
        <div>
          <div class="card__eyebrow">Agenda</div>
          <h3 class="card__title" style="margin:0">Próximos partidos</h3>
        </div>
        <button class="btn btn--ghost btn--sm" id="btn-ver-partidos">Ver todos</button>
      </div>
      <div id="agenda-partidos" class="agenda-list">
        <!-- Se llena con JS -->
      </div>
    </div>

    <!-- Tus equipos -->
    <div class="card mb-4">
      <div class="flex items-center justify-between mb-4">
        <div>
          <div class="card__eyebrow">Tus equipos</div>
          <h3 class="card__title" style="margin:0">Mis equipos</h3>
        </div>
        <button class="btn btn--ghost btn--sm" id="btn-ver-mi-equipo">Ver más</button>
      </div>
      <div id="tus-equipos" class="feed-list">
        <!-- Se llena con JS -->
      </div>
    </div>

    <!-- Comunidades sugeridas -->
    <div class="card mb-4">
      <div class="flex items-center justify-between mb-2">
        <div>
          <div class="card__eyebrow">Comunidades</div>
          <h3 class="card__title" style="margin:0">Descubrí comunidades</h3>
        </div>
        <button class="btn btn--ghost btn--sm" id="btn-ver-comunidades">Ver todas</button>
      </div>
      <p class="card__subtitle mb-4">Encontrá gente que juega lo mismo</p>
      <div id="grupos-sugeridos" class="feed-list">
        <!-- Se llena con JS -->
      </div>

      <div class="sidebar-divider" style="margin:var(--space-3) 0"></div>

      <button class="btn btn--primary btn--block btn--sm" id="btn-crear-comunidad">
        + Crear comunidad
      </button>
    </div>

    <!-- Torneos abiertos -->
    <div class="card card--highlight">
      <div class="flex items-center justify-between mb-2">
        <div>
          <div class="card__eyebrow">Recomendado</div>
          <h3 class="card__title" style="margin:0">Torneos abiertos</h3>
        </div>
      </div>
      <p class="card__subtitle mb-4">Inscripciones activas</p>
      <div id="torneos-abiertos" class="feed-list">
        <!-- Se llena con JS -->
      </div>
    </div>

  </aside>
</div>
