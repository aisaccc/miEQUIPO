<!-- ================= SALUDO / HEADER DE PÁGINA ================= -->
<div class="page-hero">
  <div class="page-eyebrow" id="inicio-eyebrow">Cargando...</div>
  <h1 class="page-title page-title--xl" id="inicio-titulo">¡Hola!</h1>
  <p class="page-subtitle">Esto es lo que está pasando en tu comunidad deportiva.</p>
</div>

<div class="page-grid inicio-grid">

  <!-- ================= COLUMNA PRINCIPAL ================= -->
  <div class="page-grid__main">

    <!-- Composer -->
    <div class="composer">
      <div class="composer__top">
        <img id="composer-avatar" src="" alt="" class="avatar avatar--md" />
        <button class="composer__input" id="btn-abrir-composer">
          ¿Qué quieres publicar?
        </button>
      </div>
    </div>

    <!-- Filtros del feed -->
    <!-- Filtros del feed -->
    <div class="feed-filters">
      <button class="chip chip--active" data-feed="todo">
        Todo
      </button>
      
      <button class="chip" data-feed="post">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:6px;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        Publicaciones
      </button>
      
      <button class="chip" data-feed="partido">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:6px;"><circle cx="12" cy="12" r="10"/><path d="m12 2-3 7h6z"/><path d="m12 22-3-7h6z"/><path d="M2 12h7l2-3"/><path d="M22 12h-7l-2-3"/></svg>
        Partidos
      </button>
      
      <button class="chip" data-feed="torneo">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:6px;"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
        Torneos
      </button>
      
      <button class="chip" data-feed="grupo">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:6px;"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Grupos
      </button>
      
      <button class="chip" data-feed="amigos">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:6px;"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
        Amigos
      </button>
    </div>

    <!-- Feed -->
    <div id="feed"></div>

  </div>

  <!-- ================= COLUMNA LATERAL ================= -->
  <aside class="page-grid__aside">

    <!-- Agenda: próximos partidos -->
    <div class="card mb-4">
      <div class="flex items-center justify-between mb-4">
        <div>
          <div class="card__eyebrow">Agenda</div>
          <h3 class="card__title" style="margin:0">Próximos partidos</h3>
        </div>
        <button class="btn btn--ghost btn--sm" id="btn-ver-partidos">Ver todos</button>
      </div>
      <div id="agenda-partidos" class="agenda-list">
        <!-- Se llena con JS -->
      </div>
    </div>

    <!-- Tus equipos -->
    <div class="card mb-4">
      <div class="flex items-center justify-between mb-4">
        <div>
          <div class="card__eyebrow">Tus equipos</div>
          <h3 class="card__title" style="margin:0">Mis equipos</h3>
        </div>
        <button class="btn btn--ghost btn--sm" id="btn-ver-mi-equipo">Ver más</button>
      </div>
      <div id="tus-equipos" class="feed-list">
        <!-- Se llena con JS -->
      </div>
    </div>

    <!-- Comunidades sugeridas -->
    <div class="card mb-4">
      <div class="flex items-center justify-between mb-2">
        <div>
          <div class="card__eyebrow">Comunidades</div>
          <h3 class="card__title" style="margin:0">Descubrí comunidades</h3>
        </div>
        <button class="btn btn--ghost btn--sm" id="btn-ver-comunidades">Ver todas</button>
      </div>
      <div id="grupos-sugeridos" class="feed-list">
        <!-- Se llena con JS -->
      </div>

      <div class="sidebar-divider" style="margin:var(--space-3) 0"></div>

      <button class="btn btn--primary btn--block btn--sm" id="btn-crear-comunidad">
        + Crear comunidad
      </button>
    </div>

    <!-- Torneos abiertos -->
    <div class="card card--highlight">
      <div class="flex items-center justify-between mb-2">
        <div>
          <div class="card__eyebrow">Recomendado</div>
          <h3 class="card__title" style="margin:0">Torneos abiertos</h3>
        </div>
      </div>
      <p class="card__subtitle mb-4">Inscripciones activas</p>
      <div id="torneos-abiertos" class="feed-list">
        <!-- Se llena con JS -->
      </div>
    </div>

  </aside>
</div>
