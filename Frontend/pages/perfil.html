<h1 class="page-title">Mi Perfil</h1>

<!-- ================= HEADER DEL PERFIL ================= -->
<div class="card mb-4">
  <div class="profile-header">
    <img id="perfil-avatar" src="" alt="" class="avatar avatar--xl" />

    <div style="flex:1; min-width:0">
      <h2 id="perfil-nombre" class="card__title" style="font-size:var(--fs-xl)"></h2>
      <p id="perfil-username" class="card__subtitle"></p>
      <p id="perfil-bio" class="text-sm text-muted mt-4"></p>

      <div class="flex gap-2 mt-4" style="flex-wrap:wrap" id="perfil-deportes-chips"></div>
      <div class="flex gap-2 mt-4" style="flex-wrap:wrap">
        <span id="perfil-edad" class="badge badge--neutral"></span>
        <span id="perfil-pais" class="badge badge--neutral"></span>
        <span id="perfil-ciudad" class="badge badge--neutral"></span>
      </div>
    </div>

    <div style="display:flex; gap:8px; flex-direction:column">
      <button class="btn btn--primary btn--sm" id="btn-editar-perfil">✏️ Editar perfil</button>
    </div>
  </div>
</div>

<!-- ================= ESTADÍSTICAS POR DEPORTE ================= -->
<div id="perfil-stats-deportes"></div>

<!-- ================= MIS PUBLICACIONES ================= -->
<div class="card mb-4">
  <h3 class="card__title mb-4">📝 Mis publicaciones</h3>
  <div id="perfil-publicaciones" class="feed-list"></div>
</div>

<!-- ================= ACTIVIDAD RECIENTE ================= -->
<div class="card">
  <h3 class="card__title mb-4">🕒 Actividad reciente</h3>
  <div id="perfil-actividad" class="feed-list"></div>
</div>

<!-- ================= MODAL: EDITAR PERFIL ================= -->
<div class="modal-backdrop" id="modal-editar-perfil">
  <div class="modal" style="max-width: 560px;">
    <div class="modal__header">
      <h3 class="modal__title">Editar perfil</h3>
      <button class="modal__close" data-cerrar-modal="modal-editar-perfil">✕</button>
    </div>

    <div class="modal__body">

      <!-- Foto de perfil -->
      <div class="field">
        <label class="field__label">Foto de perfil</label>

        <div style="display:flex; align-items:center; gap:var(--space-4); margin-bottom:var(--space-4)">
          <img id="edit-perf-avatar-preview" src="" alt="" class="avatar avatar--lg" />
          <div style="flex:1">
            <label class="btn btn--primary btn--sm" style="cursor:pointer; display:inline-flex">
              📷 Subir foto
              <input type="file" id="edit-perf-avatar-file" accept="image/*" style="display:none" />
            </label>
            <button class="btn btn--ghost btn--sm" id="edit-perf-avatar-quitar">Quitar</button>
          </div>
        </div>

        <label class="field__label">O elige una:</label>
        <div id="perfil-galeria-avatares" class="posiciones-lista" style="min-height:auto"></div>
      </div>

      <div class="field">
        <label class="field__label" for="edit-perf-nombre">Nombre completo *</label>
        <input type="text" id="edit-perf-nombre" class="field__input" maxlength="60" />
      </div>

      <div class="field">
        <label class="field__label" for="edit-perf-username">Nombre de usuario *</label>
        <input type="text" id="edit-perf-username" class="field__input" maxlength="30" pattern="[a-zA-Z0-9_]{3,20}" />
      </div>

      <div class="field">
        <label class="field__label" for="edit-perf-bio">Bio</label>
        <textarea id="edit-perf-bio" class="textarea" maxlength="200" placeholder="Cuéntanos algo sobre ti..."></textarea>
      </div>

      <div class="form-row">
        <div class="field">
          <label class="field__label" for="edit-perf-edad">Edad</label>
          <input type="number" id="edit-perf-edad" class="field__input" min="10" max="100" placeholder="Ej: 25" />
        </div>
        <div class="field">
          <label class="field__label" for="edit-perf-pais">País</label>
          <select id="edit-perf-pais" class="field__input">
            <option value="">Selecciona un país...</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label class="field__label" for="edit-perf-ciudad">Ciudad</label>
        <input type="text" id="edit-perf-ciudad" class="field__input" maxlength="40" placeholder="Ej: Santiago" />
      </div>

      <!-- DEPORTES -->
      <div class="field">
        <label class="field__label">Deportes que practico</label>

        <div style="display:flex; gap:8px; margin-bottom:var(--space-3)">
          <select id="edit-perf-nuevo-deporte" class="field__input" style="flex:1">
            <option value="">Agregar deporte...</option>
          </select>
          <button type="button" class="btn btn--primary btn--sm" id="edit-perf-add-deporte">+</button>
        </div>

        <div id="edit-perf-deportes-lista" class="feed-list"></div>
      </div>

    </div>

    <div class="modal__footer">
      <button class="btn btn--ghost" data-cerrar-modal="modal-editar-perfil">Cancelar</button>
      <button class="btn btn--primary" id="btn-guardar-perfil">Guardar cambios</button>
    </div>
  </div>
</div>

<!-- ================= MODAL: EDITAR STATS DE UN DEPORTE ================= -->
<div class="modal-backdrop" id="modal-editar-stats-deporte">
  <div class="modal" style="max-width: 460px;">
    <div class="modal__header">
      <h3 class="modal__title" id="stats-deporte-titulo">Editar estadísticas</h3>
      <button class="modal__close" data-cerrar-modal="modal-editar-stats-deporte">✕</button>
    </div>

    <div class="modal__body">
      <p class="text-xs text-muted mb-4">
        Marca el ✓ de cada registro para que sea <strong>público</strong> en tu perfil.
        Si lo dejas sin marcar, solo lo verás tú.
      </p>

      <div id="stats-deporte-campos"></div>
    </div>

    <div class="modal__footer">
      <button class="btn btn--ghost" data-cerrar-modal="modal-editar-stats-deporte">Cancelar</button>
      <button class="btn btn--primary" id="btn-guardar-stats-deporte">Guardar</button>
    </div>
  </div>
</div>
