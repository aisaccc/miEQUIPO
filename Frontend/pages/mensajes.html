<div class="chat-layout">
  <!-- ================= LISTA DE CONVERSACIONES ================= -->
  <aside class="chat-layout__list">
    <div class="chat-list-toolbar">
      <div class="chat-list-toolbar__search">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
        <input
          type="text"
          id="buscar-conversacion"
          placeholder="Buscar conversación..."
        />
      </div>
      <button class="chat-list-toolbar__btn" id="btn-nueva-conv" title="Nueva conversación">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
    </div>
    
    <!-- Pestañas para separar chats 1 a 1 de los Canales -->
    <div class="chat-tabs" style="display: flex; padding: 0 16px; gap: 10px; margin-bottom: 10px;">
      <button class="btn btn--ghost btn--sm active" data-tab-msg="conv" style="flex:1; border-bottom: 2px solid var(--color-primary); border-radius:0;">Mensajes</button>
      <button class="btn btn--ghost btn--sm" data-tab-msg="canal" style="flex:1; border-bottom: 2px solid transparent; border-radius:0;">Canales</button>
    </div>

    <!-- Listas (Solo una de cada una) -->
    <div id="lista-conversaciones" class="chat-list"></div>
    
    <!-- Lista de canales (oculta por defecto) -->
    <div id="lista-canales" class="chat-list" style="display: none;"></div>
  </aside>

  <!-- ================= PANEL DE CHAT ================= -->
  <section class="chat-layout__panel" id="panel-mensajes">
    <div class="chat-empty">
      <div class="chat-empty__icon">
        <svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </div>
      <h3 class="chat-empty__titulo">Tus mensajes</h3>
      <p class="chat-empty__text">Seleccioná una conversación de la lista o iniciá una nueva.</p>
    </div>
  </section>
</div>

<!-- ================= MODAL: NUEVA CONVERSACIÓN ================= -->
<div class="modal-backdrop" id="modal-nueva-conv">
  <div class="modal" style="max-width: 480px;">
    <div class="modal__header">
      <h3 class="modal__title">Nueva conversación</h3>
      <button class="modal__close" data-cerrar-modal="modal-nueva-conv">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="modal__body">
      <div class="field">
        <input
          type="text"
          id="buscar-usuario"
          class="field__input"
          placeholder="Buscar por nombre o usuario..."
        />
      </div>

      <div id="lista-usuarios"></div>
    </div>

    <div class="modal__footer">
      <button class="btn btn--ghost" data-cerrar-modal="modal-nueva-conv">Cerrar</button>
    </div>
  </div>
</div>
