<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <defs>
    <style>
      .linea { stroke: #C8CCD1; stroke-width: 2; fill: none; opacity: 0.35; }
      .balon { fill: #C8CCD1; opacity: 0.25; }
      .balon-linea { stroke: #FFFFFF; stroke-width: 1.5; fill: none; opacity: 0.7; }
    </style>
  </defs>

  <g transform="translate(40, 60)">
    <rect x="0" y="0" width="260" height="180" rx="8" class="linea"/>
    <line x1="130" y1="0" x2="130" y2="180" class="linea"/>
    <circle cx="130" cy="90" r="28" class="linea"/>
    <rect x="0" y="50" width="30" height="80" class="linea"/>
    <rect x="230" y="50" width="30" height="80" class="linea"/>
  </g>

  <g transform="translate(620, 100)">
    <circle cx="0" cy="0" r="45" class="balon"/>
    <path d="M0 -20 L14 -8 L8 10 L-8 10 L-14 -8 Z" class="balon-linea"/>
    <path d="M0 -45 L0 -20 M45 0 L20 0 M0 45 L0 20 M-45 0 L-20 0" class="balon-linea"/>
  </g>

  <g transform="translate(60, 340)">
    <rect x="0" y="0" width="180" height="120" rx="8" class="linea"/>
    <line x1="90" y1="0" x2="90" y2="120" class="linea"/>
    <circle cx="90" cy="60" r="22" class="linea"/>
    <path d="M0 0 Q 20 60 0 120" class="linea"/>
    <path d="M180 0 Q 160 60 180 120" class="linea"/>
  </g>

  <g transform="translate(320, 400)">
    <circle cx="0" cy="0" r="32" class="balon"/>
    <path d="M-32 0 L32 0 M0 -32 L0 32 M-22 -22 Q0 0 -22 22 M22 -22 Q0 0 22 22" class="balon-linea"/>
  </g>

  <g transform="translate(520, 480)">
    <rect x="0" y="0" width="220" height="140" rx="8" class="linea"/>
    <line x1="110" y1="0" x2="110" y2="140" class="linea"/>
    <line x1="0" y1="35" x2="220" y2="35" class="linea"/>
    <line x1="0" y1="105" x2="220" y2="105" class="linea"/>
    <line x1="60" y1="35" x2="60" y2="105" class="linea"/>
    <line x1="160" y1="35" x2="160" y2="105" class="linea"/>
  </g>

  <g transform="translate(180, 620)">
    <circle cx="0" cy="0" r="26" class="balon"/>
    <path d="M-20 -12 Q0 0 -20 12 M20 -12 Q0 0 20 12" class="balon-linea"/>
  </g>

  <g transform="translate(640, 680)">
    <rect x="0" y="0" width="140" height="100" rx="6" class="linea"/>
    <line x1="70" y1="0" x2="70" y2="100" class="linea"/>
    <line x1="0" y1="50" x2="140" y2="50" class="linea"/>
  </g>

  <g transform="translate(700, 300)">
    <circle cx="0" cy="0" r="24" class="balon"/>
    <path d="M-24 0 Q0 -14 24 0 M-12 -20 Q0 8 12 -20 M-12 20 Q0 -8 12 20" class="balon-linea"/>
  </g>

  <circle cx="380" cy="620" r="6" class="balon"/>
  <circle cx="500" cy="300" r="5" class="balon"/>
</svg>